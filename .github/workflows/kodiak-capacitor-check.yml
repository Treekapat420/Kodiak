name: Kodiak Native Generate

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-native-projects:
    runs-on: macos-latest

    steps:
      - name: Check out Kodiak
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install

      - name: Add Android project if needed
        working-directory: mobile
        run: |
          if [ ! -d android ]; then
            npx cap add android
          else
            echo "Android project already exists."
          fi

      - name: Add iOS project if needed
        working-directory: mobile
        run: |
          if [ ! -d ios ]; then
            npx cap add ios
          else
            echo "iOS project already exists."
          fi

      - name: Sync Capacitor
        working-directory: mobile
        run: npx cap sync

      - name: Configure Kodiak native deep links
        working-directory: mobile
        run: node scripts/configure-native.mjs

      - name: Check Android
        working-directory: mobile
        run: npx cap doctor android

      - name: Check iOS
        working-directory: mobile
        run: npx cap doctor ios

      - name: Commit generated native projects
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/android mobile/ios
          if git diff --cached --quiet; then
            echo "No native project changes to commit."
          else
            git commit -m "Generate Kodiak iOS and Android apps"
            git push
          fi
