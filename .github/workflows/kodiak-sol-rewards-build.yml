name: Kodiak SOL Rewards - Anchor Build

on:
  workflow_dispatch:
  push:
    branches:
      - rewards-devnet
      - devnet
    paths:
      - "solana-rewards/**"
      - ".github/workflows/kodiak-sol-rewards-build.yml"
  pull_request:
    paths:
      - "solana-rewards/**"
      - ".github/workflows/kodiak-sol-rewards-build.yml"

permissions:
  contents: read

jobs:
  anchor-build:
    name: Compile hardened rewards program
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: solana-rewards

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Solana + Anchor toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSfL https://solana-install.solana.workers.dev | bash

          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.avm/bin" >> "$GITHUB_PATH"

          export PATH="$HOME/.local/share/solana/install/active_release/bin:$HOME/.cargo/bin:$HOME/.avm/bin:$PATH"

          avm install 0.32.1
          avm use 0.32.1

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$HOME/.cargo/bin:$HOME/.avm/bin:$PATH"

          rustc --version
          cargo --version
          solana --version
          anchor --version

          test "$(anchor --version | awk '{print $2}')" = "0.32.1"

      - name: Format Rust source
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all

      - name: Cargo check
        shell: bash
        run: |
          set -euo pipefail
          cargo check --workspace --all-targets

      - name: Anchor build
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$HOME/.cargo/bin:$HOME/.avm/bin:$PATH"
          anchor build

      - name: Show build artifacts
        if: success()
        shell: bash
        run: |
          find target/deploy -maxdepth 1 -type f -print || true
          find target/idl -maxdepth 1 -type f -print || true

      - name: Upload compiled program and IDL
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kodiak-sol-rewards-anchor-build
          path: |
            solana-rewards/target/deploy/*.so
            solana-rewards/target/idl/*.json
            solana-rewards/target/types/*.ts
          if-no-files-found: error
          retention-days: 7
