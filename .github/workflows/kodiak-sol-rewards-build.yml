name: Kodiak SOL Rewards - Anchor Build

on:
  workflow_dispatch:
  push:
    branches:
      - rewards-devnet
      - devnet
    paths:
      - "solana-rewards/**"
      - ".github/workflows/kodiak-sol-rewards-build.yml"
  pull_request:
    paths:
      - "solana-rewards/**"
      - ".github/workflows/kodiak-sol-rewards-build.yml"

permissions:
  contents: read

jobs:
  anchor-build:
    name: Compile hardened rewards program
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: solana-rewards

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Solana + Anchor toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSfL https://solana-install.solana.workers.dev | bash

          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.avm/bin" >> "$GITHUB_PATH"

          export PATH="$HOME/.local/share/solana/install/active_release/bin:$HOME/.cargo/bin:$HOME/.avm/bin:$PATH"

          avm install 0.32.1
          avm use 0.32.1

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$HOME/.cargo/bin:$HOME/.avm/bin:$PATH"

          rustc --version
          cargo --version
          solana --version
          anchor --version

          test "$(anchor --version | awk '{print $2}')" = "0.32.1"

      - name: Format Rust source
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all

      - name: Pin SBF-compatible dependencies
        shell: bash
        run: |
          set -euo pipefail

          rm -f Cargo.lock
          cargo generate-lockfile

          pin_if_present () {
            pkg="$1"
            ver="$2"

            if grep -q "^name = \"$pkg\"$" Cargo.lock; then
              echo "Pinning $pkg -> $ver"
              cargo update -p "$pkg" --precise "$ver"
            else
              echo "Skipping $pkg; not present in Cargo.lock"
            fi
          }

          # Keep only the edition-2024/problematic transitive crates pinned.
          # Do not pin indexmap: toml_edit in this dependency tree requires ^2.13.
          pin_if_present blake3 1.8.2
          pin_if_present constant_time_eq 0.3.1
          pin_if_present base64ct 1.7.3
          pin_if_present cpufeatures 0.2.17

          echo "Relevant locked versions:"
          grep -A2 -E '^name = "(blake3|constant_time_eq|base64ct|cpufeatures|indexmap)"$' Cargo.lock || true

      - name: Cargo check
        shell: bash
        run: |
          set -euo pipefail
          cargo check --workspace --all-targets --locked

      - name: Anchor build
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$HOME/.cargo/bin:$HOME/.avm/bin:$PATH"
          anchor build --locked

      - name: Show build artifacts
        if: success()
        shell: bash
        run: |
          find target/deploy -maxdepth 1 -type f -print || true
          find target/idl -maxdepth 1 -type f -print || true

      - name: Upload compiled program and IDL
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kodiak-sol-rewards-anchor-build
          path: |
            solana-rewards/target/deploy/*.so
            solana-rewards/target/idl/*.json
            solana-rewards/target/types/*.ts
            solana-rewards/Cargo.lock
          if-no-files-found: error
          retention-days: 7
