name: Test Kodiak Rewards Full Cycle on Devnet

on:
  push:
    branches:
      - devnet
    paths:
      - ".github/workflows/test-kodiak-rewards-full-cycle-devnet.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-cycle:
    name: Deposit, publish epoch, claim
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Install Solana web3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/kodiak-rewards-test
          cd /tmp/kodiak-rewards-test
          npm init -y >/dev/null 2>&1
          npm install --silent @solana/web3.js@1.98.4

      - name: Run hardened rewards smoke test
        shell: bash
        env:
          DEPLOYER_KEY: ${{ secrets.KODIAK_REWARDS_DEVNET_DEPLOYER_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOYER_KEY"

          cat > /tmp/kodiak-rewards-test/test.mjs <<'NODE'
          import crypto from "node:crypto";
          import {
            Connection,
            Keypair,
            PublicKey,
            SystemProgram,
            Transaction,
            TransactionInstruction,
            sendAndConfirmTransaction,
            LAMPORTS_PER_SOL
          } from "@solana/web3.js";

          const RPC = "https://api.devnet.solana.com";
          const PROGRAM_ID = new PublicKey(
            "68ueodLyUjvPDYq7tkfV6NSy3ThAwtQcBGvMtg6aVUTB"
          );
          const MINT = new PublicKey(
            "5gKUUuL6iSknoKDpbCNruVDNv2XBHQs1D5MhZs8M5X55"
          );
          const EXPECTED_DEPLOYER =
            "4937J2tRmFTq2b4usH2tococxp6StXevF11xryp4sm6k";

          const DEPOSIT_LAMPORTS = 10_000_000n; // 0.01 SOL
          const REWARD_LAMPORTS = 1_000_000n;  // 0.001 SOL
          const EPOCH_ID = 0n;

          const connection = new Connection(RPC, "confirmed");

          const authority = Keypair.fromSecretKey(
            Uint8Array.from(JSON.parse(process.env.DEPLOYER_KEY))
          );

          if (authority.publicKey.toBase58() !== EXPECTED_DEPLOYER) {
            throw new Error(
              `Wrong deployer key. Got ${authority.publicKey.toBase58()}`
            );
          }

          function disc(name) {
            return crypto
              .createHash("sha256")
              .update(`global:${name}`)
              .digest()
              .subarray(0, 8);
          }

          function u64(value) {
            const b = Buffer.alloc(8);
            b.writeBigUInt64LE(BigInt(value));
            return b;
          }

          function i64(value) {
            const b = Buffer.alloc(8);
            b.writeBigInt64LE(BigInt(value));
            return b;
          }

          function u32(value) {
            const b = Buffer.alloc(4);
            b.writeUInt32LE(Number(value));
            return b;
          }

          function hashParts(parts) {
            const h = crypto.createHash("sha256");
            for (const part of parts) h.update(part);
            return h.digest();
          }

          function rewardLeaf(epochId, wallet, amount) {
            return hashParts([
              Buffer.from("kodiak-sol-rewards-v1"),
              u64(epochId),
              wallet.toBuffer(),
              u64(amount)
            ]);
          }

          const [config] = PublicKey.findProgramAddressSync(
            [Buffer.from("kodiak-rewards"), MINT.toBuffer()],
            PROGRAM_ID
          );

          const [vault] = PublicKey.findProgramAddressSync(
            [Buffer.from("vault"), config.toBuffer()],
            PROGRAM_ID
          );

          const epochSeed = u64(EPOCH_ID);
          const [epoch] = PublicKey.findProgramAddressSync(
            [Buffer.from("epoch"), config.toBuffer(), epochSeed],
            PROGRAM_ID
          );

          const [receipt] = PublicKey.findProgramAddressSync(
            [Buffer.from("claim"), epoch.toBuffer(), authority.publicKey.toBuffer()],
            PROGRAM_ID
          );

          console.log("Program:", PROGRAM_ID.toBase58());
          console.log("Mint:", MINT.toBase58());
          console.log("Authority / claimant:", authority.publicKey.toBase58());
          console.log("Config PDA:", config.toBase58());
          console.log("Vault PDA:", vault.toBase58());
          console.log("Epoch PDA:", epoch.toBase58());
          console.log("Receipt PDA:", receipt.toBase58());

          const configInfo = await connection.getAccountInfo(config, "confirmed");
          if (!configInfo || !configInfo.owner.equals(PROGRAM_ID)) {
            throw new Error("Rewards config is not initialized correctly.");
          }

          const programInfo = await connection.getAccountInfo(PROGRAM_ID, "confirmed");
          if (!programInfo || !programInfo.executable) {
            throw new Error("Rewards program is not executable.");
          }

          const startingAuthority = await connection.getBalance(
            authority.publicKey,
            "confirmed"
          );
          const startingVault = await connection.getBalance(vault, "confirmed");

          console.log(
            "Starting authority balance:",
            startingAuthority / LAMPORTS_PER_SOL,
            "SOL"
          );
          console.log(
            "Starting vault balance:",
            startingVault / LAMPORTS_PER_SOL,
            "SOL"
          );

          if (startingAuthority < 20_000_000) {
            throw new Error(
              "Devnet deployer balance is too low. Fund it before rerunning."
            );
          }

          // ---- 1) Deposit 0.01 SOL to the PDA vault ----
          const depositIx = new TransactionInstruction({
            programId: PROGRAM_ID,
            keys: [
              { pubkey: authority.publicKey, isSigner: true, isWritable: true },
              { pubkey: MINT, isSigner: false, isWritable: false },
              { pubkey: config, isSigner: false, isWritable: true },
              { pubkey: vault, isSigner: false, isWritable: true },
              { pubkey: SystemProgram.programId, isSigner: false, isWritable: false }
            ],
            data: Buffer.concat([disc("deposit"), u64(DEPOSIT_LAMPORTS)])
          });

          const depositSig = await sendAndConfirmTransaction(
            connection,
            new Transaction().add(depositIx),
            [authority],
            { commitment: "confirmed", preflightCommitment: "confirmed" }
          );

          console.log("Deposit signature:", depositSig);

          const afterDepositVault = await connection.getBalance(vault, "confirmed");
          if (afterDepositVault < startingVault + Number(DEPOSIT_LAMPORTS)) {
            throw new Error("Vault balance did not increase by the deposit amount.");
          }

          // ---- 2) Publish epoch 0 ----
          // Single-leaf Merkle tree: root == leaf and proof is empty.
          const root = rewardLeaf(EPOCH_ID, authority.publicKey, REWARD_LAMPORTS);

          const publishIx = new TransactionInstruction({
            programId: PROGRAM_ID,
            keys: [
              { pubkey: authority.publicKey, isSigner: true, isWritable: true },
              { pubkey: MINT, isSigner: false, isWritable: false },
              { pubkey: config, isSigner: false, isWritable: true },
              { pubkey: vault, isSigner: false, isWritable: false },
              { pubkey: epoch, isSigner: false, isWritable: true },
              { pubkey: SystemProgram.programId, isSigner: false, isWritable: false }
            ],
            data: Buffer.concat([
              disc("publish_epoch"),
              u64(EPOCH_ID),
              root,
              u64(REWARD_LAMPORTS),
              i64(0)
            ])
          });

          const publishSig = await sendAndConfirmTransaction(
            connection,
            new Transaction().add(publishIx),
            [authority],
            { commitment: "confirmed", preflightCommitment: "confirmed" }
          );

          console.log("Publish epoch signature:", publishSig);

          const epochInfo = await connection.getAccountInfo(epoch, "confirmed");
          if (!epochInfo || !epochInfo.owner.equals(PROGRAM_ID)) {
            throw new Error("Epoch PDA was not created correctly.");
          }

          // ---- 3) Claim epoch 0 ----
          // Vec<[u8;32]> with zero proof nodes => four-byte length of zero.
          const claimIx = new TransactionInstruction({
            programId: PROGRAM_ID,
            keys: [
              { pubkey: authority.publicKey, isSigner: true, isWritable: true },
              { pubkey: MINT, isSigner: false, isWritable: false },
              { pubkey: config, isSigner: false, isWritable: true },
              { pubkey: epoch, isSigner: false, isWritable: true },
              { pubkey: vault, isSigner: false, isWritable: true },
              { pubkey: receipt, isSigner: false, isWritable: true },
              { pubkey: SystemProgram.programId, isSigner: false, isWritable: false }
            ],
            data: Buffer.concat([
              disc("claim"),
              u64(EPOCH_ID),
              u64(REWARD_LAMPORTS),
              u32(0)
            ])
          });

          const beforeClaimAuthority = await connection.getBalance(
            authority.publicKey,
            "confirmed"
          );
          const beforeClaimVault = await connection.getBalance(vault, "confirmed");

          const claimSig = await sendAndConfirmTransaction(
            connection,
            new Transaction().add(claimIx),
            [authority],
            { commitment: "confirmed", preflightCommitment: "confirmed" }
          );

          console.log("Claim signature:", claimSig);

          const afterClaimAuthority = await connection.getBalance(
            authority.publicKey,
            "confirmed"
          );
          const afterClaimVault = await connection.getBalance(vault, "confirmed");
          const receiptInfo = await connection.getAccountInfo(receipt, "confirmed");

          if (!receiptInfo || !receiptInfo.owner.equals(PROGRAM_ID)) {
            throw new Error("Claim receipt PDA was not created correctly.");
          }

          if (beforeClaimVault - afterClaimVault !== Number(REWARD_LAMPORTS)) {
            throw new Error(
              `Vault did not decrease by exactly ${REWARD_LAMPORTS} lamports.`
            );
          }

          console.log(
            "Vault before claim:",
            beforeClaimVault / LAMPORTS_PER_SOL,
            "SOL"
          );
          console.log(
            "Vault after claim:",
            afterClaimVault / LAMPORTS_PER_SOL,
            "SOL"
          );
          console.log(
            "Claimant balance before claim:",
            beforeClaimAuthority / LAMPORTS_PER_SOL,
            "SOL"
          );
          console.log(
            "Claimant balance after claim:",
            afterClaimAuthority / LAMPORTS_PER_SOL,
            "SOL"
          );

          console.log("SUCCESS: hardened rewards full cycle passed on Devnet.");
          console.log("Deposit:", depositSig);
          console.log("Publish:", publishSig);
          console.log("Claim:", claimSig);
          NODE

          cd /tmp/kodiak-rewards-test
          node test.mjs

      - name: Test summary
        if: success()
        shell: bash
        run: |
          {
            echo "## Kodiak Hardened Rewards â Devnet Full Cycle Passed"
            echo ""
            echo "- Deposited 0.01 Devnet SOL to the PDA vault"
            echo "- Published reward epoch 0"
            echo "- Allocated 0.001 SOL to the test claimant"
            echo "- Claimed through the on-chain rewards program"
            echo "- Verified claim receipt PDA"
            echo "- Verified vault decreased by exactly 0.001 SOL"
            echo ""
            echo "**Program:** \`68ueodLyUjvPDYq7tkfV6NSy3ThAwtQcBGvMtg6aVUTB\`"
          } >> "$GITHUB_STEP_SUMMARY"
